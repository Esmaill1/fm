<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إذاعة القرآن الكريم</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    style="
      background-image: url('https://giffiles.alphacoders.com/211/211273.gif');
    "
  >
    <div class="container">
      <div class="player-card">
        <div class="logo">
          <h1>إذاعة القرآن الكريم</h1>
          <span>بث مباشر</span>
        </div>

        <div class="status">
          <div class="status-indicator">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">جاهز للتشغيل</span>
          </div>
        </div>

        <div class="controls">
          <button class="play-btn" id="playBtn" aria-label="Play/Pause">
            <svg class="play-icon" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z" />
            </svg>
            <svg class="pause-icon" viewBox="0 0 24 24">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
            </svg>
          </button>
        </div>

        <div class="volume-control">
          <button
            class="volume-icon"
            id="volumeIcon"
            aria-label="تبديل الصوت"
            type="button"
          >
            <svg viewBox="0 0 24 24" role="presentation">
              <path
                d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"
              />
            </svg>
          </button>
          <input
            type="range"
            class="volume-slider"
            id="volumeSlider"
            min="0"
            max="100"
            value="80"
            aria-label="مستوى الصوت"
          />
        </div>

        <div class="listening-time">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            height="12"
            viewBox="0 0 24 24"
            width="12"
            fill="rgba(255,215,0,0.6)"
          >
            <path
              d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"
            />
            <path d="M12.5 7H11v6l5.25 3.15.75-1.23-4.5-2.67z" />
          </svg>
          وقت الاستماع الخاص بك: <span id="listeningTime">0 ثانية</span>
          <span class="info-tooltip">
            ?
            <span class="tooltip-text"
              >البيانات محفوظة في متصفحك. إذا قمت بمسح ذاكرة التخزين المؤقت
              (Cache) سيتم حذف وقت الاستماع.</span
            >
          </span>
        </div>
      </div>

      <a
        href="https://forms.gle/2M8vQzAZrjYa1sZZ9"
        target="_blank"
        class="suggestions-btn"
      >
        لديك اقتراح؟
      </a>
    </div>

    <div class="play-counter">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        height="14"
        viewBox="0 0 24 24"
        width="14"
        fill="rgba(255,215,0,0.6)"
      >
        <path
          d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"
        />
      </svg>
      <span id="playCount">0</span> عدد مرات التشغيل
    </div>

    <audio id="audioPlayer" preload="none">
      <source
        src="https://stream.radiojar.com/8s5u5tpdtwzuv"
        type="audio/mpeg"
      />
    </audio>

    <script src="script.js"></script>
  </body>
</html>
